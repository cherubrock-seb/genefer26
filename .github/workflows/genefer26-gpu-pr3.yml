name: Genefer26 NVIDIA GFN16 validation

on:
  push:
    branches:
      - perf/gpu-square128-pad16-nvidia-20261106
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libgmp-dev ocl-icd-opencl-dev python3

      - name: Run source invariant test
        run: python3 tests/check_gpu_square128_pad16_nvidia.py

      - name: Compile default-off GPU host objects
        run: |
          make -B -C build -f makefile_linux_x64 BOINC= COMP=gcc \
            CFLAGS="-Wall -Wextra -Wsign-conversion -DGENEFER_GPU_SQ128_PAD16_NVIDIA=0 -DGENEFER_GPU_CARRY_SHIFT5_NVIDIA_GFN16=0" \
            transformg_sse2.o transformg_avx2.o transformg_avx512.o

      - name: Compile opt-in GPU host objects
        run: |
          make -B -C build -f makefile_linux_x64 BOINC= COMP=gcc \
            CFLAGS="-Wall -Wextra -Wsign-conversion -DGENEFER_GPU_SQ128_PAD16_NVIDIA=1 -DGENEFER_GPU_CARRY_SHIFT5_NVIDIA_GFN16=1" \
            transformg_sse2.o transformg_avx2.o transformg_avx512.o
